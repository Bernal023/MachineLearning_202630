# Jupyter Book — Informe técnico final: pronóstico de volatilidad de criptomonedas
title: "Pronóstico de volatilidad de criptomonedas con Machine Learning"
author: "Jassan Arteta y Mateo Bernal"
copyright: "2026"
logo: ""

# Las celdas leen artefactos precalculados y versionados; se re-ejecutan al compilar.
execute:
  execute_notebooks: force
  timeout: 600
  stderr_output: remove
  allow_errors: false

# Capítulos históricos del sitio MyST anterior: no forman parte de este libro.
exclude_patterns:
  - "_build/*"
  - "sections/*"
  - "entregable1_master.md"
  - "myst.yml"
  - "figures/*"
  - "README*"
  - "**/.ipynb_checkpoints/*"

bibtex_bibfiles:
  - references.bib

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence
    - deflist
    - html_image
    - linkify
    - substitution
  myst_url_schemes: [http, https, mailto]
  myst_substitutions:
    dashboard: "https://machinelearning-202630.onrender.com/"
    repo: "https://github.com/jassan-bit/MachineLearning_202630"
    seed: "42"

sphinx:
  config:
    bibtex_reference_style: author_year
    mathjax3_config:
      tex:
        macros:
          argmin: "\\operatorname{arg\\,min}"
    nb_render_figure_width: "90%"
    suppress_warnings: ["mystnb.unknown_mime_type"]

html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true
  baseurl: https://jassan-bit.github.io/MachineLearning_202630/
  comments: {}

repository:
  url: https://github.com/jassan-bit/MachineLearning_202630
  path_to_book: book
  branch: main

launch_buttons:
  notebook_interface: classic
