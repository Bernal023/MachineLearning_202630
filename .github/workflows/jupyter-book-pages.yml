name: Jupyter Book → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-book.txt

      - name: Instalar dependencias del libro
        run: pip install -r requirements-book.txt

      - name: Regenerar artifacts/ (sin entrenar)
        run: python src/build_artifacts_metadata.py

      - name: Compilar Jupyter Book
        run: jupyter-book build book/ --all

      - name: Comprobar salida
        run: test -f book/_build/html/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
